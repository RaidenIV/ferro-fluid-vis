<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Ferrofluid Audio Visualizer</title>
  <script type="importmap">
    {
      "imports": {
        "gl-matrix": "https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/+esm",
        "rxjs": "https://cdn.jsdelivr.net/npm/rxjs@7.5.6/+esm",
        "twgl.js": "https://cdn.jsdelivr.net/npm/twgl.js@5.0.4/+esm"
      }
    }
  </script>
  <script type="module" src="./js/app.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app-shell">
    <aside id="sidebar" aria-label="Visualizer controls">
      <div class="sidebar-scroll">
        <header class="brand-block">
          <div class="eyebrow">AUDIO VISUALIZER</div>
          <h1>FERROFLUID</h1>
          <div id="app-status" class="status-line"><span class="status-dot"></span><span>Ready</span></div>
        </header>

        <section class="control-section open" data-section>
          <button class="section-title" type="button" data-section-toggle>
            <span>File and Playback</span><span class="section-chevron">⌄</span>
          </button>
          <div class="section-body">
            <input id="audio-file" class="sr-only" type="file" accept="audio/*">
            <button id="load-audio" class="button primary wide" type="button">Load Audio</button>
            <div id="track-name" class="track-name">No audio loaded</div>
            <div class="button-row">
              <button id="play-pause" class="button" type="button" disabled>Play</button>
              <button id="reset-audio" class="button" type="button" disabled>Reset</button>
              <button id="microphone" class="button" type="button">Mic</button>
            </div>
            <label class="control compact timeline-control">
              <span class="control-label"><span>Timeline</span><span id="time-readout">00:00 / 00:00</span></span>
              <input id="timeline" type="range" min="0" max="1" step="0.01" value="0" disabled>
            </label>
            <div class="inline-controls">
              <label class="toggle-control"><input id="loop-audio" type="checkbox" checked><span class="toggle"></span><span>Loop audio</span></label>
              <label class="toggle-control"><input id="mute-audio" type="checkbox"><span class="toggle"></span><span>Mute</span></label>
            </div>
            <label class="control compact">
              <span class="control-label"><span>Volume</span><output id="volume-value">85%</output></span>
              <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85">
            </label>
          </div>
        </section>

        <section class="control-section open" data-section>
          <button class="section-title" type="button" data-section-toggle>
            <span>Audio Reactivity</span><span class="section-chevron">⌄</span>
          </button>
          <div class="section-body">
            <label class="toggle-control"><input id="reactive-enabled" type="checkbox" checked><span class="toggle"></span><span>Audio reactive</span></label>
            <label class="control select-control">
              <span class="control-label">Reaction source</span>
              <select id="reaction-band">
                <option value="overall">Overall</option>
                <option value="bass">Bass</option>
                <option value="mids">Mids</option>
                <option value="treble">Treble</option>
              </select>
            </label>
            <label class="control select-control">
              <span class="control-label">Audio resolution</span>
              <select id="fft-size">
                <option value="256">1× / 256 FFT</option>
                <option value="512">2× / 512 FFT</option>
                <option value="1024">4× / 1024 FFT</option>
                <option value="2048" selected>8× / 2048 FFT</option>
                <option value="4096">16× / 4096 FFT</option>
                <option value="8192">32× / 8192 FFT</option>
                <option value="16384">64× / 16384 FFT</option>
              </select>
            </label>
            <label class="control compact"><span class="control-label"><span>Sensitivity</span><output id="sensitivity-value">1.35×</output></span><input id="sensitivity" type="range" min="0.25" max="3" step="0.05" value="1.35"></label>
            <label class="control compact"><span class="control-label"><span>Smoothing</span><output id="smoothing-value">72%</output></span><input id="smoothing" type="range" min="0" max="0.95" step="0.01" value="0.72"></label>
            <label class="control compact"><span class="control-label"><span>Noise threshold</span><output id="threshold-value">0.025</output></span><input id="threshold" type="range" min="0" max="0.15" step="0.005" value="0.025"></label>
            <div class="meter-grid" aria-label="Audio levels">
              <div class="meter"><span>BASS</span><i><b id="meter-bass"></b></i></div>
              <div class="meter"><span>MIDS</span><i><b id="meter-mids"></b></i></div>
              <div class="meter"><span>TREBLE</span><i><b id="meter-treble"></b></i></div>
              <div class="meter"><span>ALL</span><i><b id="meter-overall"></b></i></div>
            </div>
          </div>
        </section>

        <section class="control-section open" data-section>
          <button class="section-title" type="button" data-section-toggle>
            <span>Ferrofluid</span><span class="section-chevron">⌄</span>
          </button>
          <div class="section-body">
            <label class="control compact"><span class="control-label"><span>Base shape</span><output id="base-zoom-value">0.50</output></span><input id="base-zoom" type="range" min="0.15" max="0.85" step="0.01" value="0.50"></label>
            <label class="control compact"><span class="control-label"><span>Spike height</span><output id="spike-height-value">1.35×</output></span><input id="spike-height" type="range" min="0" max="3" step="0.05" value="1.35"></label>
            <label class="control compact"><span class="control-label"><span>Spike sharpness</span><output id="spike-sharpness-value">0.45×</output></span><input id="spike-sharpness" type="range" min="0" max="2" step="0.05" value="0.45"></label>
            <label class="control compact"><span class="control-label"><span>Fluid agitation</span><output id="agitation-value">0.65×</output></span><input id="agitation" type="range" min="0" max="2" step="0.05" value="0.65"></label>
            <label class="control compact"><span class="control-label"><span>Camera pulse</span><output id="camera-pulse-value">0.00×</output></span><input id="camera-pulse" type="range" min="0" max="1.5" step="0.05" value="0"></label>
          </div>
        </section>

        <section class="control-section" data-section>
          <button class="section-title" type="button" data-section-toggle>
            <span>Simulation</span><span class="section-chevron">⌄</span>
          </button>
          <div class="section-body">
            <label class="control compact"><span class="control-label"><span>Mass</span><output id="mass-value">1.00</output></span><input id="mass" type="range" min="0.1" max="5" step="0.05" value="1"></label>
            <label class="control compact"><span class="control-label"><span>Rest density</span><output id="density-value">1.80</output></span><input id="density" type="range" min="0.2" max="5" step="0.05" value="1.8"></label>
            <label class="control compact"><span class="control-label"><span>Gas constant</span><output id="gas-value">40</output></span><input id="gas" type="range" min="10" max="250" step="1" value="40"></label>
            <label class="control compact"><span class="control-label"><span>Viscosity</span><output id="viscosity-value">5.5</output></span><input id="viscosity" type="range" min="1" max="20" step="0.1" value="5.5"></label>
            <label class="control compact"><span class="control-label"><span>Simulation steps</span><output id="steps-value">0</output></span><input id="steps" type="range" min="0" max="6" step="1" value="0"></label>
            <label class="control compact"><span class="control-label"><span>Pointer radius</span><output id="pointer-radius-value">1.10</output></span><input id="pointer-radius" type="range" min="0.1" max="5" step="0.05" value="1.1"></label>
            <label class="control compact"><span class="control-label"><span>Pointer strength</span><output id="pointer-strength-value">15</output></span><input id="pointer-strength" type="range" min="1" max="35" step="1" value="15"></label>
          </div>
        </section>

        <section class="control-section" data-section>
          <button class="section-title" type="button" data-section-toggle>
            <span>Camera</span><span class="section-chevron">⌄</span>
          </button>
          <div class="section-body">
            <label class="control compact"><span class="control-label"><span>Rotate Y-axis</span><output id="yaw-value">0.0°</output></span><input id="yaw" type="range" min="-180" max="180" step="0.5" value="0"></label>
            <label class="control compact"><span class="control-label"><span>Elevation</span><output id="elevation-value">26.6°</output></span><input id="elevation" type="range" min="8" max="72" step="0.5" value="26.565"></label>
            <label class="control compact"><span class="control-label"><span>Distance</span><output id="distance-value">1.12</output></span><input id="distance" type="range" min="0.72" max="2.4" step="0.01" value="1.118034"></label>
            <label class="toggle-control"><input id="auto-rotate" type="checkbox"><span class="toggle"></span><span>Auto rotate</span></label>
            <label class="control compact"><span class="control-label"><span>Rotate speed</span><output id="rotate-speed-value">8°/s</output></span><input id="rotate-speed" type="range" min="1" max="30" step="0.5" value="8"></label>
            <button id="reset-camera" class="button wide" type="button">Center Visualization</button>
          </div>
        </section>

        <section class="control-section" data-section>
          <button class="section-title" type="button" data-section-toggle>
            <span>Appearance</span><span class="section-chevron">⌄</span>
          </button>
          <div class="section-body">
            <label class="control color-control"><span class="control-label">Background</span><input id="background-color" type="color" value="#0d0d0d"></label>
            <label class="control compact"><span class="control-label"><span>Material brightness</span><output id="brightness-value">1.00×</output></span><input id="brightness" type="range" min="0.25" max="2" step="0.05" value="1"></label>
            <label class="control compact"><span class="control-label"><span>Iridescence</span><output id="iridescence-value">1.00×</output></span><input id="iridescence" type="range" min="0" max="3" step="0.05" value="1"></label>
          </div>
        </section>

        <section class="control-section open" data-section>
          <button class="section-title" type="button" data-section-toggle>
            <span>Export</span><span class="section-chevron">⌄</span>
          </button>
          <div class="section-body">
            <label class="control text-control"><span class="control-label">Filename</span><input id="export-filename" type="text" value="ferrofluid-visualizer" spellcheck="false"></label>
            <div class="two-col">
              <label class="control select-control"><span class="control-label">Format</span><select id="export-format"><option value="webm">WebM</option><option value="mp4">MP4</option></select></label>
              <label class="control select-control"><span class="control-label">FPS</span><select id="export-fps"><option value="30">30</option><option value="60" selected>60</option></select></label>
            </div>
            <label class="control select-control"><span class="control-label">Resolution</span><select id="export-resolution"><option value="current">Current viewport</option><option value="1920x1080" selected>1920 × 1080</option><option value="1080x1920">1080 × 1920</option><option value="2560x1440">2560 × 1440</option><option value="3840x2160">3840 × 2160</option></select></label>
            <div class="two-col">
              <label class="control select-control"><span class="control-label">Bitrate</span><select id="export-bitrate"><option value="8000000">8 Mbps</option><option value="16000000" selected>16 Mbps</option><option value="24000000">24 Mbps</option><option value="40000000">40 Mbps</option></select></label>
              <label class="control select-control"><span class="control-label">Range</span><select id="export-range"><option value="full">Full track</option><option value="current">Current → end</option></select></label>
            </div>
            <button id="export-video" class="button primary wide" type="button">Export Video</button>
            <div class="button-row two">
              <button id="export-png" class="button" type="button">Export PNG</button>
              <button id="export-json" class="button" type="button">Export JSON</button>
            </div>
            <div id="export-progress" class="export-progress" hidden>
              <div class="progress-track"><span id="export-progress-bar"></span></div>
              <div class="progress-meta"><span id="export-stage">Preparing</span><span id="export-percent">0%</span></div>
              <button id="cancel-export" class="button danger wide" type="button">Cancel Export</button>
            </div>
          </div>
        </section>

        <footer class="sidebar-footer">
          <span class="aigox-mark">AIGOX</span>
          <span>VISUAL SYSTEM</span>
        </footer>
      </div>
    </aside>

    <main id="viewport">
      <canvas id="visualizer-canvas"></canvas>
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">‹</button>
      <div class="viewport-brand">FERROFLUID <span>/ AUDIO REACTIVE</span></div>
      <div class="interaction-hint">LMB disturb · RMB/Shift drag orbit · wheel zoom</div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>
